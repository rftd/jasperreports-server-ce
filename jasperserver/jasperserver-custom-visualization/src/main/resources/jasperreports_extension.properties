net.sf.jasperreports.extension.registry.factory.customvisualization=net.sf.jasperreports.customvisualization.CVComponentExtensionsRegistryFactory
net.sf.jasperreports.extension.registry.factory.cv.jackson.mapping=net.sf.jasperreports.jackson.util.JacksonMappingExtensionsRegistryFactory
net.sf.jasperreports.extension.jackson.mapping.customvisualization=net.sf.jasperreports.customvisualization.CVComponent

# JR7 filters Java report-cache deserialization. Permit the compiled component
# data type explicitly, following the official module extension contract.
net.sf.jasperreports.extension.registry.factory.cv.deserialization.whitelist=net.sf.jasperreports.engine.util.StandardDeserializationClassWhitelistExtension
net.sf.jasperreports.deserialization.class.whitelist.openjrs.cv=net.sf.jasperreports.customvisualization.design.CVDesignComponent

# Retain the legacy Community data-adapter secrets provider registration.
net.sf.jasperreports.extension.registry.factory.identity.secrets.provider=net.sf.jasperreports.util.IdentitySecretsProviderExtensionsRegistryFactory
net.sf.jasperreports.extension.identity.secrets.category.da=net.sf.jasperreports.data.adapter
