name: Local Docker environment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitattributes'
      - 'compose.yaml'
      - 'jasperserver/**'
      - 'jasperserver-ui/**'
      - 'scripts/test-openjrs-branding.py'
      - 'scripts/test-legacy-viewer.py'
      - 'scripts/test-sample-map-table.py'
      - 'scripts/sync-jr7-samples.py'
      - 'scripts/update-native-samples.py'
      - 'scripts/test-native-samples.py'
      - 'scripts/verify-no-vendor-heartbeat.py'
      - 'docker/local/**'
      - '.github/workflows/local-docker.yml'

permissions:
  contents: read

concurrency:
  group: local-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: openjrs-docker-ci-${{ github.run_id }}
      OPENJRS_PORT: '18080'
      JRS_BASE_URL: http://127.0.0.1:18080/jasperserver
      JRS_SMOKE_USER: jasperadmin
      JRS_SMOKE_PASSWORD: jasperadmin
      OPENJRS_JAVA_OPTS: -Xms256m -Xmx2048m -Djava.awt.headless=true -Dopenjrs.map.tile.url=http://127.0.0.1:8080/jasperserver/scripts/openjrs-map-test-tile.png
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and shell scripts
        run: |
          docker compose config --quiet
          bash -n docker/local/*.sh
          python3 -m py_compile docker/local/configure.py
          python3 scripts/sync-jr7-samples.py
      - name: Build frontend, backend, initializer and runtime images
        run: |
          set -o pipefail
          docker compose --progress plain build 2>&1 | tee "$RUNNER_TEMP/docker-build.log"
      - name: Initialize database and start OpenJRS
        run: docker compose up -d --wait --wait-timeout 900
      - name: Check persistence and protection against lost encryption keys
        run: bash docker/local/test-persistence.sh
      - name: Wait for restarted server
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$JRS_BASE_URL/login.html" >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Check REST authentication and PDF/XLSX exports
        run: bash scripts/test-legacy-rest-reports.sh
      - name: Install pinned browser test dependencies
        run: python3 -m pip install playwright==1.62.0 greenlet==3.5.5 pyee==13.0.1
      - name: Check branding, viewer controls and Community components
        run: |
          python3 scripts/test-openjrs-branding.py
          python3 scripts/test-legacy-viewer.py
      - name: Check shipped table, OpenStreetMap, drilldown and image exports
        env:
          JRS_MAP_EXPORT: '1'
        run: |
          docker compose cp jasperserver/jasperserver-custom-visualization/src/test/resources/map-test-tile.png openjrs:/usr/local/tomcat/webapps/jasperserver/scripts/openjrs-map-test-tile.png
          python3 scripts/test-sample-map-table.py
      - name: Check native JR7 employee samples and drilldown
        run: python3 scripts/test-native-samples.py
      - name: Check sandboxed Chromium in the runtime image
        run: docker compose exec -T openjrs chromium --headless --disable-gpu --dump-dom about:blank
      - name: Export a Community visualization using Chromium inside Tomcat
        run: |
          docker compose cp jasperserver/jasperserver-custom-visualization/src/test/resources/cv-browser-smoke.js openjrs:/usr/local/tomcat/webapps/jasperserver/scripts/openjrs-cv-export.js
          python3 docker/local/test-visualization.py
      - name: Capture diagnostics
        if: always()
        run: |
          docker compose logs --no-color > "$RUNNER_TEMP/docker-runtime.log" 2>&1 || true
          docker compose ps -a > "$RUNNER_TEMP/docker-status.txt" 2>&1 || true
          docker compose cp openjrs:/usr/local/tomcat/webapps/jasperserver/WEB-INF/logs "$RUNNER_TEMP/application-logs" || true
          rg -n -A20 'ERROR|Caused by:' "$RUNNER_TEMP/application-logs/jasperserver.log" | tail -100 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-docker-diagnostics
          path: |
            ${{ runner.temp }}/docker-*.log
            ${{ runner.temp }}/docker-status.txt
            ${{ runner.temp }}/application-logs/**
            ${{ runner.temp }}/openjrs-branding/**
            ${{ runner.temp }}/viewer-smoke/**
            ${{ runner.temp }}/docker-cv.pdf
            ${{ runner.temp }}/map-table-tests/**
            ${{ runner.temp }}/native-sample-tests/**
          retention-days: 7
      - name: Remove disposable CI environment
        if: always()
        run: docker compose down --volumes
